[database]
driver = "postgres"
schema = "public"
url_env = "DATABASE_URL"

[generator]
output = "entities.graphqls"
descriptions = true

[tables]
include = [".*"]
exclude = ["flyway_schema_history"]

[columns]
exclude_foreign_keys = true
keep_primary_keys = true
include = []
exclude = []

[enums]
include_unreferenced = false
include = []
