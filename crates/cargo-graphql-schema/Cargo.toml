[package]
name = "cargo-graphql-schema"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/cargo-graphql-schema"
authors.workspace = true
description = "Cargo subcommand and CLI for generating GraphQL entity SDL from PostgreSQL schemas"
readme = "../../README.md"
keywords = ["graphql", "postgresql", "codegen", "cargo", "seaorm"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "cargo-graphql-schema"
path = "src/main.rs"

[dependencies]
clap.workspace = true
postgres-graphql-schema = { version = "0.1.0", path = "../postgres-graphql-schema" }
tokio.workspace = true

[dev-dependencies]
tempfile = "3.27.0"
