name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.99.1
      - name: Format
        run: cargo fmt --all --check
      - name: Check
        run: cargo check --all-targets
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Unit and doc tests
        run: |
          cargo test --all-features
          cargo test --doc
      - name: Package and publish dry-run
        run: |
          scripts/package.sh
          scripts/publish-dry-run.sh

  databases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
      - name: Install SeaORM compatibility oracle
        run: cargo install sea-orm-cli --version 2.0.4 --locked
      - name: PostgreSQL, MySQL, MariaDB and SQLite compatibility
        run: scripts/verify-databases.sh

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.23.0 --locked
      - name: Audit advisories
        run: cargo audit
