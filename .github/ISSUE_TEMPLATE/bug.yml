name: Bug report
description: Report incorrect generation, verification, or metadata behavior
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Include the command and sanitized error/output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: database-graphql-schema version
    validations:
      required: true
  - type: dropdown
    id: dbms
    attributes:
      label: DBMS
      options:
        - PostgreSQL
        - MySQL
        - MariaDB
        - SQLite
        - Other / requested backend
    validations:
      required: true
  - type: input
    id: dbms_version
    attributes:
      label: DBMS version
    validations:
      required: true
  - type: textarea
    id: fixture
    attributes:
      label: Minimal synthetic schema/config
      description: Do not include credentials, private schemas, internal URLs, or customer data.
