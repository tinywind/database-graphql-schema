# Semantic equivalent of the Kotlin 0.1.1 compatibility configuration.
[database]
schema = "public"
url_env = "TEST_DATABASE_URL"

[generator]
output = "actual.graphqls"
descriptions = true
header = "# Generated by GRAPHQL-SCHEMA-GENERATOR from database schema \"public\". Do not edit."

[tables]
include = [".*"]
exclude = ["internal_.*"]

[columns]
exclude_foreign_keys = true
keep_primary_keys = true
include = ["project\\.owner_id"]
exclude = ["account\\.secret_hash", "unsupported_record\\.payload"]

[types.sql]
jsonb = "String"
numeric = "BigDecimal"

[[types.override]]
pattern = "organization\\.network"
graphql = "String"

[enums]
include_unreferenced = false
include = []
